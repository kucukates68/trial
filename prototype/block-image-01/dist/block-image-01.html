<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blok Resim 01</title>
<style>:root { --bg:#f7f1e3; --card:#fffdf8; --ink:#4a3a2a; --mute:#9a8a72; --acc:#ff9f1c; --line:#e6dcc6; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
#app { display:flex; flex-direction:column; height:100%; }
header#top { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:8px 14px; }
.brand { font-weight:800; font-size:16px; } .brand small { color:var(--mute); font-weight:500; margin-left:6px; }
header label { color:var(--mute); font-size:12px; display:flex; gap:5px; align-items:center; }
select, button { background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font:inherit; cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--acc); } button:disabled { opacity:.45; cursor:not-allowed; }
#pathPills { display:flex; gap:4px; } #pathPills button { padding:3px 10px; border-radius:14px; font-size:12px; } #pathPills button.on { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:700; }
#progTxt { margin-left:auto; color:var(--mute); font-size:12px; }
main { flex:1; min-height:0; display:flex; }
#boardWrap { flex:1; position:relative; min-width:0; }
#board { position:absolute; inset:0; width:100%; height:100%; display:block; }
#msg { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); max-width:92%; text-align:center; font-size:13px; color:var(--mute); pointer-events:none; }
#msg.bad { color:#d9534f; font-weight:700; } #msg.good { color:#3a9d5d; font-weight:700; }
footer#controls { display:flex; gap:12px; justify-content:center; align-items:stretch; padding:8px 12px 12px; flex-wrap:wrap; }
#hand { display:flex; gap:12px; justify-content:center; }
.card { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:8px 10px 6px; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:104px; min-height:104px; box-shadow:0 2px 0 var(--line); }
.card.sel { transform:translateY(-3px); background:#fffdf8; }
.card.nofit { opacity:.45; } .card canvas { display:block; } .card .pn { font-size:10px; color:var(--mute); margin-top:3px; }
#sendBtn { background:var(--acc); color:#fff; border:0; border-radius:16px; font-weight:800; font-size:16px; padding:0 22px; box-shadow:0 3px 0 #d9830c; }
#sendBtn:disabled { background:#ddd0b6; box-shadow:0 3px 0 #c9bb9d; }
#modal { position:fixed; inset:0; background:#0006; display:none; align-items:center; justify-content:center; z-index:9; } #modal.show { display:flex; }
#modal .box { background:#fff; border-radius:12px; padding:16px 18px; width:min(680px,92vw); max-height:84vh; overflow:auto; }
#modal table { width:100%; border-collapse:collapse; font-size:12px; } #modal td,#modal th { padding:3px 6px; border-bottom:1px solid var(--line); text-align:left; }
@media (max-width:720px) { header#top { padding:6px 8px; gap:6px 8px; } #progTxt { width:100%; margin:0; } .card { min-width:0; flex:1; min-height:92px; padding:6px; } #hand { width:100%; gap:6px; } #sendBtn { width:100%; padding:10px; } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">Blok Resim<small>01 · kedi</small></div>
    <div id="pathPills" title="Yol görünümü"><button data-m="0">Kapalı</button><button data-m="A">İz</button><button data-m="B">Kritik</button></div>
    <label>Hız <select id="speedSel"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option></select></label>
    <button id="restartBtn" title="R">Yeniden başlat</button>
    <button id="parityBtn">Parity</button>
    <span id="progTxt"></span>
  </header>
  <main>
    <section id="boardWrap"><canvas id="board"></canvas><div id="msg"></div></section>
  </main>
  <footer id="controls">
    <div id="hand"></div>
    <button id="sendBtn" title="Enter / Boşluk">Gönder</button>
  </footer>
</div>
<div id="modal"><div class="box"><div id="modalBody"></div><p style="text-align:right"><button id="modalClose">Kapat</button></p></div></div>
<script>/* block-image-01 — OYUN ÇEKİRDEĞİ (arayüzden bağımsız). Python referansı: tools/ref.py (parity: tests/parity.js).

 *    Yürünebilir = zemin + giriş + BOŞ hedef hücre; dolan hedef KALICI engel. Hedef indeksleri satır-ana sıradadır.

 *  • Yerleşebilir ⇔ parçanın TÜM hedef hücreleri boş ve girişten erişilebilir.
 *  • place: hücreler en derinden başlayarak sıralanır; rota = girişten BFS en kısa yol (parça başı BFS); sonra parça kalıcı engel olur.

(function (root, factory) { if (typeof module === 'object' && module.exports) module.exports = factory(); else root.BI = factory(); })(typeof self !== 'undefined' ? self : this, function () {

    for (var r = 0; r < this.h; r++) for (var c = 0; c < this.w; c++) {
      var ch = c < rows[r].length ? rows[r][c] : '#', i = r * this.w + c;
      if (ch === '#') this.kind[i] = 0; else if (ch === '.') this.kind[i] = 1; else if (ch === 'E') { this.kind[i] = 2; this.entrances.push(i); } else { this.kind[i] = 3; cells.push({ r: r, c: c, cell: i }); }

<script>/* block-image-01 — ARAYÜZ. Kurallar yalnız engine.js'te; burada gösterim, giriş ve animasyon vardır.
 * Döngü: GÖR (3 kart) → SEÇ (kart: hedef bloğu resimde belirir) → GÖNDER → işçiler taşır → blok yerine oturur → resim büyür → o slota yeni blok gelir.
 * Animasyon kozmetiktir: mantıksal durum tıklamada ANINDA değişir; işçilerin varış sırası = yerleşme sırası (en derinden başla). */
(function () {
  'use strict';
  var LV = window.BI_LEVEL, VEC = window.BI_VECTORS || [], BI = window.BI, qs = new URLSearchParams(location.search);
  var $ = function (id) { return document.getElementById(id); };
  var L = new BI.Level(LV.grid, LV.pieces, LV.hand), CELLCOL = [];   // CELLCOL (kedinin görünen rengi) aşağıda piece.color'dan kurulur; level verisindeki eski kedi renk listesi render kaynağı DEĞİLDİR
  // PARÇA RENGİ: level tasarımcısının verdiği piece.color (turuncu/mavi/kırmızı/yeşil). Hedef resimden TÜRETİLMEZ, slota bağlı DEĞİLDİR, mekanik DEĞİLDİR (yalnız görsel kimlik).
  var COLHEX = { orange: '#ff9f1c', blue: '#3b82f6', red: '#ef4444', green: '#2fb67c' };
  var PCOL = LV.pieces.map(function (p) { if (!COLHEX[p.color]) throw new Error('piece.color eksik: ' + p.id); return COLHEX[p.color]; });
  var OWNER = new Int32Array(L.n); L.pieces.forEach(function (p) { p.cells.forEach(function (ti) { OWNER[ti] = p.i; }); });
  for (var ci = 0; ci < L.n; ci++) CELLCOL[ci] = PCOL[OWNER[ci]];   // targetColor[cell] = owningPiece.color  (kedi = 25 parçanın birleşmiş hâli)
  var cfg = { speed: Math.max(0.5, Math.min(200, parseFloat(qs.get('speed')) || 1)), path: ['0', 'A', 'B'].indexOf((qs.get('path') || '').toUpperCase()) >= 0 ? qs.get('path').toUpperCase() : 'A' };
  var canvas = $('board'), ctx = canvas.getContext('2d');
  var G = { st: null, visual: null, status: 'idle', selected: -1, read: null, workers: [], pops: {}, history: [], waveEnd: 0, pending: null, wonAt: 0, sealedShown: [], sealedPath: null,
            s: 10, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0, handSig: '', flash: null, sparks: [] };
  function now() { return performance.now() / 1000; }

  // ---------------------------------------------------------------- renk
  function rgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mix(a, b, t) { var x = rgb(a), y = rgb(b); return 'rgb(' + Math.round(x[0] + (y[0] - x[0]) * t) + ',' + Math.round(x[1] + (y[1] - x[1]) * t) + ',' + Math.round(x[2] + (y[2] - x[2]) * t) + ')'; }
  function setMsg(t, cls) { var m = $('msg'); m.textContent = t; m.className = cls || ''; }

  // ---------------------------------------------------------------- oyun akışı
  function newGame() {
    G.st = L.newState(); G.visual = new Uint8Array(G.st.filled); G.status = 'idle'; G.selected = -1; G.read = null; G.workers = []; G.pops = {}; G.history = []; G.pending = null; G.sealedShown = []; G.sealedPath = null; G.handSig = ''; G.flash = null; G.sparks = []; G.wonAt = 0;
    setMsg('Üç bloktan birine bas: resimde nereye oturacağı görünür. Hangisini ŞİMDİ göndermelisin?'); refresh();
  }
  function computeRead(slot) {
    var res = L.place(G.st, slot); if (!res) return null;
    return { slot: slot, cells: res.cells.slice(), routes: res.steps.map(function (s) { return s.route; }), cut: res.sealed.slice(), won: res.won, stuck: res.stuck, piece: res.piece };
  }
  function select(slot) {
    if (G.status !== 'idle') return; var cards = L.cards(G.st); if (cards[slot] === null || cards[slot] === undefined) return;
    var rd = computeRead(slot); if (!rd) { setMsg('Bu blok şu an yerleşemez: hedefine giden yol kapalı.', 'bad'); return; }
    if (G.selected === slot) { send(slot); return; }
    G.selected = slot; G.read = rd; setMsg('Seçili bloğun hedefi resimde parlıyor; ışık noktaları işçilerin rotası. Göndermek için aynı karta ya da Gönder\'e bas.'); refresh();
  }
  function send(slot) {
    if (G.status !== 'idle') return; var res = L.place(G.st, slot); if (!res) { setMsg('Bu blok şu an yerleşemez.', 'bad'); return; }
    var t0 = now(), before = G.st; G.history.push({ slot: slot, before: before, piece: res.piece }); G.st = res.state; G.pending = { sealed: res.sealed, won: res.won, stuck: res.stuck }; G.dest = res.cells.slice();
    var steps = res.steps, v = 40 * cfg.speed, gap = 0.04 / cfg.speed, tr = steps.map(function (s) { return Math.max(1, s.route.length - 1) / v; }), T0 = 0.05, i;

    G.workers = steps.map(function (s, k) { return { ti: s.ti, path: s.route, depart: t0 + T0 + k * gap - tr[k], arrive: t0 + T0 + k * gap, travel: tr[k], state: 0, doneAt: 0, cargo: PCOL[res.piece] }; });
    G.waveEnd = t0 + T0 + (steps.length - 1) * gap + 0.32 / Math.sqrt(cfg.speed);
    G.selected = -1; G.read = null; G.status = 'anim'; setMsg(''); refresh();
  }
  function finishWave() {
    G.visual = new Uint8Array(G.st.filled); G.workers = []; var p = G.pending; G.pending = null; G.flash = { t0: now(), cells: G.dest.slice() };
    if (p.won) { G.status = 'won'; G.wonAt = now(); setMsg('Resim tamamlandı! ' + G.history.length + ' blok gönderdin.', 'good'); }
    else if (p.sealed.length) { G.status = 'sealed'; G.sealedShown = p.sealed; G.sealedPath = null; setMsg('Kilitlendi: resmin bir bölümüne artık girişten yol yok (turuncu). Yeniden başlat.', 'bad'); }
    else if (p.stuck) { G.status = 'stuck'; setMsg('Sıkıştı: elindeki bloklardan hiçbirine yol yok. Yeniden başlat.', 'bad'); }
    else { G.status = 'idle'; setMsg('Sıradaki blok? Bir karta bas: hedefi görünür.'); }
    refresh();
  }
  function undoNone() {}

  // ---------------------------------------------------------------- yerleşim / çizim
  function layout() {
    var wrap = $('boardWrap'); G.cw = wrap.clientWidth; G.ch = wrap.clientHeight; G.dpr = window.devicePixelRatio || 1; var d = G.dpr;
    canvas.width = Math.round(G.cw * d); canvas.height = Math.round(G.ch * d);
    var ps = Math.max(4, Math.floor(Math.min(G.cw * d / (L.w + 3), (G.ch - 26) * d / (L.h + 3)))); G.s = ps / d;
    G.ox = Math.round((G.cw * d - L.w * ps) / 2) / d; G.oy = Math.round(((G.ch - 22) * d - L.h * ps) / 2) / d;

  function cx(cell) { return G.ox + (cell % L.w + 0.5) * G.s; } function cy(cell) { return G.oy + (Math.floor(cell / L.w) + 0.5) * G.s; }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

    var gap = 0, k = 1 + (pop || 0), sz = (s - gap) * k, px = x + (s - sz) / 2, py = y + (s - sz) / 2;

  function edgePath(tis) {

    tis.forEach(function (ti) {

      [[-1, 0, x, y, x + 1, y], [1, 0, x, y + 1, x + 1, y + 1], [0, -1, x, y, x, y + 1], [0, 1, x + 1, y, x + 1, y + 1]].forEach(function (d) {

  }
  function drawHole() { var e = L.entrances[0], ex = G.ox + (e % L.w + 0.5) * G.s, ey = G.oy + L.h * G.s + G.s * 0.15; ctx.fillStyle = '#9b7a55'; ctx.beginPath(); ctx.ellipse(ex, ey, G.s * 2.6, G.s * 1.0, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#4a3322'; ctx.beginPath(); ctx.ellipse(ex, ey + G.s * 0.08, G.s * 2.0, G.s * 0.72, 0, 0, 7); ctx.fill(); }

  function drawWorkers(t) {

  function draw() {

    ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0); ctx.clearRect(0, 0, G.cw, G.ch);

  // ---------------------------------------------------------------- el / panel
  function drawPieceTo(cv, pi, cell) {
    var cs = L.pieces[pi].cells.map(function (ti) { return L.targets[ti]; }), r0 = 1e9, c0 = 1e9, r1 = -1, c1 = -1; cs.forEach(function (t) { r0 = Math.min(r0, t.r); c0 = Math.min(c0, t.c); r1 = Math.max(r1, t.r); c1 = Math.max(c1, t.c); });

  }
  function buildHand(seen, idle) {
