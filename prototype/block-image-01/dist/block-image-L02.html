<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blok Resim 01</title>
<style>:root { --bg:#f7f1e3; --card:#fffdf8; --ink:#4a3a2a; --mute:#9a8a72; --acc:#ff9f1c; --line:#e6dcc6; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
#app { display:flex; flex-direction:column; height:100%; }
header#top { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:8px 14px; }
.brand { font-weight:800; font-size:16px; } .brand small { color:var(--mute); font-weight:500; margin-left:6px; }
header label { color:var(--mute); font-size:12px; display:flex; gap:5px; align-items:center; }
select, button { background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font:inherit; cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--acc); } button:disabled { opacity:.45; cursor:not-allowed; }
#pathPills, #colPills { display:flex; gap:4px; } #pathPills button, #colPills button { padding:3px 10px; border-radius:14px; font-size:12px; } #pathPills button.on, #colPills button.on { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:700; }
#progTxt { margin-left:auto; color:var(--mute); font-size:12px; }
main { flex:1; min-height:0; display:flex; }
#boardWrap { flex:1; position:relative; min-width:0; }
#board { position:absolute; inset:0; width:100%; height:100%; display:block; }
#msg { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); max-width:92%; text-align:center; font-size:13px; color:var(--mute); pointer-events:none; }
#msg.bad { color:#d9534f; font-weight:700; } #msg.good { color:#3a9d5d; font-weight:700; }
footer#controls { display:flex; gap:12px; justify-content:center; align-items:stretch; padding:8px 12px 12px; flex-wrap:wrap; }
#hand { display:flex; gap:12px; justify-content:center; }
.card { background:var(--card); border:2px solid var(--line); border-radius:16px; padding:8px 10px 6px; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:104px; min-height:104px; box-shadow:0 2px 0 var(--line); }
.card.sel { transform:translateY(-3px); background:#fffdf8; }
.card.nofit { opacity:.45; } .card.empty { opacity:.5; border-style:dashed; background:transparent; box-shadow:none; } .card canvas { display:block; } .card .pn { font-size:10px; color:var(--mute); margin-top:3px; }
#sendBtn { background:var(--acc); color:#fff; border:0; border-radius:16px; font-weight:800; font-size:16px; padding:0 22px; box-shadow:0 3px 0 #d9830c; }
#sendBtn:disabled { background:#ddd0b6; box-shadow:0 3px 0 #c9bb9d; }
#modal { position:fixed; inset:0; background:#0006; display:none; align-items:center; justify-content:center; z-index:9; } #modal.show { display:flex; }
#modal .box { background:#fff; border-radius:12px; padding:16px 18px; width:min(680px,92vw); max-height:84vh; overflow:auto; }
#modal table { width:100%; border-collapse:collapse; font-size:12px; } #modal td,#modal th { padding:3px 6px; border-bottom:1px solid var(--line); text-align:left; }
@media (max-width:720px) { header#top { padding:6px 8px; gap:6px 8px; } #progTxt { width:100%; margin:0; } .card { min-width:0; flex:1; min-height:92px; padding:6px; } #hand { width:100%; gap:6px; } #sendBtn { width:100%; padding:10px; } }
</style>
</head>

<div id="app">

  <footer id="controls">

    <button id="sendBtn" title="Enter / Boşluk">Gönder</button>

<script>/* block-image-01 — OYUN ÇEKİRDEĞİ (arayüzden bağımsız). Python referansı: tools/ref.py (parity: tests/parity.js).
 * Kurallar:
 *  • Izgara: 'E' giriş, '#' duvar, '.' zemin (ikisi de oyuncuya çizilmez), harf = hedef hücre (resmin bir bloğu). 4-komşuluk.
 *    Yürünebilir = zemin + giriş + BOŞ hedef hücre; dolan hedef KALICI engel. Hedef indeksleri satır-ana sıradadır.
 *  • Parça = sabit geometrik blok; resimdeki TEK hedefi aynı hücreleridir. Oyuncu yalnız hangi parçayı göndereceğini seçer.
 *  • El: 3 slot; her slotun elle yazılmış sabit kuyruğu. Gönderilen kartın yerine yalnız o slotun sıradaki parçası gelir.
 *  • Yerleşebilir ⇔ parçanın TÜM hedef hücreleri boş ve girişten erişilebilir.
 *  • place: hücreler en derinden başlayarak sıralanır; rota = girişten BFS en kısa yol (parça başı BFS); sonra parça kalıcı engel olur.
 *    Sonra: sealed (boş hücre erişilemez) · stuck (hiçbir kart yerleşemez) · won (hepsi dolu).
 */
(function (root, factory) { if (typeof module === 'object' && module.exports) module.exports = factory(); else root.BI = factory(); })(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function Level(text, pieces, hand) {

    this.h = rows.length; this.w = Math.max.apply(null, rows.map(function (r) { return r.length; }));
    var n = this.h * this.w; this.kind = new Uint8Array(n); this.tIdx = new Int32Array(n).fill(-1); this.entrances = []; var cells = [];
    for (var r = 0; r < this.h; r++) for (var c = 0; c < this.w; c++) {
      var ch = c < rows[r].length ? rows[r][c] : '#', i = r * this.w + c;
      if (ch === '#') this.kind[i] = 0; else if (ch === '.') this.kind[i] = 1; else if (ch === 'E') { this.kind[i] = 2; this.entrances.push(i); } else { this.kind[i] = 3; cells.push({ r: r, c: c, cell: i }); }
    }
    cells.sort(function (a, b) { return a.r - b.r || a.c - b.c; });
    this.targets = cells.map(function (t, ti) { self.tIdx[t.cell] = ti; return t; }); this.n = this.targets.length;
    this.pieces = pieces.map(function (p, i) { return { i: i, id: p.id, cells: p.cells.map(function (x) { return self.tIdx[x[0] * self.w + x[1]]; }) }; });
    var pid = {}; this.pieces.forEach(function (p) { pid[p.id] = p.i; });
    this.hand = hand.map(function (q) { return q.map(function (id) { return pid[id]; }); });
    var cover = new Uint8Array(this.n); this.pieces.forEach(function (p) { p.cells.forEach(function (t) { cover[t]++; }); });

  }

  Level.prototype.bfs = function (filled, wantParent) {
    var w = this.w, h = this.h, n = w * h, dist = new Int32Array(n).fill(-1), parent = wantParent ? new Int32Array(n).fill(-1) : null, q = new Int32Array(n), head = 0, tail = 0;
    for (var e = 0; e < this.entrances.length; e++) { dist[this.entrances[e]] = 0; q[tail++] = this.entrances[e]; }

        var r = ur + DIRS[d][0], c = uc + DIRS[d][1]; if (r < 0 || c < 0 || r >= h || c >= w) continue;
        var v = r * w + c; if (dist[v] >= 0 || this.kind[v] === 0) continue; var ti = this.tIdx[v]; if (ti >= 0 && filled[ti]) continue;

  Level.prototype.audit = function (st) {
    var self = this, err = [], seen = {}, sent = 0, rem = 0, nP = this.pieces.length, sentSet = {};

    });

    var key = cards.map(function (c, i) { return c === null ? '-' : c + (opts[i] ? 'f' : 'x'); }).join(',') + '|' + G.selected + '|' + (idle ? 1 : 0); if (key === G.handSig) return; G.handSig = key; hand.innerHTML = '';
    cards.forEach(function (c, slot) {
      var b = document.createElement('button'), cv = document.createElement('canvas'), pn = document.createElement('span'); pn.className = 'pn';
      if (c === null) {   // kuyruk bitti: slot görünür kalır (boş yuva), ama bekleyen parça varsa asla boş olmaz (L.audit denetler)
        b.className = 'card empty'; b.id = 'slot' + slot; b.dataset.slot = slot; b.dataset.piece = ''; b.disabled = true; b.title = 'Blok ' + (slot + 1) + ' — kuyruk bitti'; pn.textContent = String(slot + 1) + ' · kuyruk bitti'; b.appendChild(pn); hand.appendChild(b); return;
      }
      var ok = !!opts[slot];   // yerleşemeyen kart GİZLENMEZ: soluk görünür, nedeni yazılır, basınca açıklama çıkar
      b.className = 'card' + (G.selected === slot ? ' sel' : '') + (ok ? '' : ' nofit'); b.id = 'slot' + slot; b.dataset.slot = slot; b.dataset.piece = L.pieces[c].id; b.disabled = !idle; b.title = 'Blok ' + (slot + 1); b.style.borderColor = G.selected === slot ? glowCol(c) : ''; if (G.selected === slot) b.style.boxShadow = '0 0 0 3px ' + glowCol(c) + '44, 0 2px 0 ' + glowCol(c);
      drawPieceTo(cv, c, window.innerWidth < 720 ? 13 : 17); b.appendChild(cv); pn.textContent = String(slot + 1) + (ok ? '' : ' · yol kapalı'); b.appendChild(pn);
      b.addEventListener('click', function () { select(slot); }); hand.appendChild(b);
    });
    if (cards.every(function (c) { return c === null; })) { var n = document.createElement('span'); n.style.color = '#9a8a72'; n.textContent = 'blok kalmadı'; hand.appendChild(n); }
  }
  function handDiag() { var d = L.diagnose(G.st), a = L.audit(G.st); return { ptr: G.st.ptr.slice(), queues: L.hand.map(function (q) { return q.map(function (p) { return L.pieces[p].id; }); }), hand: a.ids, slots: d.slots, continuable: d.continuable, deadlock: d.deadlock, audit: a }; }
  function refresh() {
    var seen = G.status === 'anim' ? { filled: G.visual, ptr: (G.history.length && G.history[G.history.length - 1].before.ptr) || G.st.ptr } : G.st, done = L.filledCount(seen.filled), idle = G.status === 'idle';
    $('progTxt').textContent = 'Resim %' + Math.round(100 * done / L.n) + ' · ' + G.history.length + ' / ' + LV.pieces.length + ' blok';
    buildHand(seen, idle); $('sendBtn').disabled = !(idle && G.selected >= 0);
    Array.prototype.forEach.call(document.querySelectorAll('#pathPills button'), function (b) { b.classList.toggle('on', b.dataset.m === cfg.path); });
  }
  function setPath(m) { cfg.path = m; refresh(); }
  function showModal(html) { $('modalBody').innerHTML = html; $('modal').classList.add('show'); }
  function runParity() {
    var ok = 0, total = 0, bad = [], rows = '';
    VEC.forEach(function (lv) { var LL = new BI.Level(lv.grid, lv.pieces, lv.hand), lok = 0; lv.cases.forEach(function (c) { total++; if (JSON.stringify(LL.simulate(c.sequence)) === JSON.stringify(c.expected)) { ok++; lok++; } else bad.push(lv.level_id + '/' + c.name); }); rows += '<tr><td>' + lv.level_id + '</td><td>' + lv.cases.length + '</td><td>' + lok + '</td></tr>'; });
    showModal('<h3>Parity: tarayıcı motoru ↔ Python referansı (tools/ref.py)</h3><p><b>' + ok + ' / ' + total + ' vaka birebir aynı</b>' + (bad.length ? '<br>Farklı: ' + bad.join(', ') : '') + '</p><table><tr><th>Seviye</th><th>Vaka</th><th>Eşleşen</th></tr>' + rows + '</table>'); return { ok: ok, total: total, bad: bad };
  }

  // ---------------------------------------------------------------- döngü / olaylar
  function frame() {
    var t = now();
    if (G.status === 'anim') {
      G.workers.forEach(function (w) { if (w.state === 0 && t >= w.arrive) { w.state = 1; w.doneAt = t; G.visual[w.ti] = 1; G.pops[w.ti] = t; if (G.sparks.length < 80) G.sparks.push({ x: cx(L.targets[w.ti].cell), y: cy(L.targets[w.ti].cell), t0: t }); } });
      if (t >= G.waveEnd) finishWave(); else if (Math.floor(t * 8) !== frame.last) { frame.last = Math.floor(t * 8); refresh(); }
    }
    draw(); requestAnimationFrame(frame);
  }
  if (LV.title) { var bs = document.querySelector('.brand small'); if (bs) bs.textContent = LV.title; document.title = 'Blok Resim · ' + LV.title; }
  $('restartBtn').addEventListener('click', newGame); $('sendBtn').addEventListener('click', function () { if (G.selected >= 0) send(G.selected); }); $('parityBtn').addEventListener('click', runParity);
  $('modalClose').addEventListener('click', function () { $('modal').classList.remove('show'); });
  $('speedSel').addEventListener('change', function () { cfg.speed = parseFloat(this.value); });
  Array.prototype.forEach.call(document.querySelectorAll('#pathPills button'), function (b) { b.addEventListener('click', function () { setPath(b.dataset.m); }); });
  window.addEventListener('resize', function () { layout(); G.handSig = ''; refresh(); });
  window.addEventListener('keydown', function (e) {
    if (e.target && /select|input|textarea/i.test(e.target.tagName)) return;
    if (e.key >= '1' && e.key <= '3') select(parseInt(e.key, 10) - 1); else if (e.key === 'Enter' || e.key === ' ') { if (G.selected >= 0) { e.preventDefault(); send(G.selected); } } else if (e.key === 'r' || e.key === 'R') newGame();
  });
  if (window.ResizeObserver) new ResizeObserver(function () { layout(); }).observe($('boardWrap'));

  window.CBGAME = {
    select: select, send: function (slot) { G.selected = -1; select(slot); select(slot); },
    state: function () { return { status: G.status, filled: L.filledCount(G.st.filled), n: L.n, placed: G.history.length, pieces: LV.pieces.length, selected: G.selected, left: L.remaining(G.st), cards: L.cards(G.st).map(function (c) { return c === null ? null : L.pieces[c].id; }) }; },
    previewCells: function () { return G.read ? G.read.cells.slice().sort(function (a, b) { return a - b; }) : null; },
    destCells: function () { return G.dest ? G.dest.slice().sort(function (a, b) { return a - b; }) : null; },
    read: function () { return G.read ? { cells: G.read.cells.slice(), routes: G.read.routes.map(function (r) { return r.slice(); }), cut: G.read.cut.slice() } : null; },
    workerPaths: function () { return G.workers.map(function (w) { return w.path.slice(); }); }, workerCount: function () { return G.workers.length; },
    geo: function () { return { ox: G.ox, oy: G.oy, s: G.s, dpr: G.dpr }; }, alphaAt: function (x, y) { return ctx.getImageData(x, y, 1, 1).data[3]; },
    pieceHex: function (pi) { return PCOL[pi]; }, pieceColor: function (pi) { return LV.pieces[pi].color; }, targetColors: function (pi) { return L.pieces[pi].cells.map(function (ti) { return CELLCOL[ti]; }); }, targetColor: function (ti) { return CELLCOL[ti]; }, owner: function (ti) { return OWNER[ti]; }, ghostPixel: function (ti) { return CBGAME.cellPixel(ti); },
    cardPixels: function (pi) { var cv = document.createElement('canvas'); drawPieceTo(cv, pi, 17); var d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data, set = {}; for (var i = 0; i < d.length; i += 4) if (d[i + 3] > 0) set[d[i] + ',' + d[i + 1] + ',' + d[i + 2] + ',' + d[i + 3]] = 1; return Object.keys(set); },
    cellPixel: function (ti) { var t = L.targets[ti], d = G.dpr, x = Math.round((G.ox + (t.c + 0.5) * G.s) * d), y = Math.round((G.oy + (t.r + 0.5) * G.s) * d), p = ctx.getImageData(x, y, 1, 1).data; return [p[0], p[1], p[2]]; },
    workerCargo: function () { return G.workers.map(function (w) { return w.cargo; }); }, hexToRgb: rgb,
    handDiag: handDiag, restart: newGame, blocks: BLOCKS,
    cardFaces: function (pi) { var cv = document.createElement('canvas'); drawPieceTo(cv, pi, 17); var cell = parseFloat(cv.dataset.cell), c0 = +cv.dataset.c0, r0 = +cv.dataset.r0, g = cv.getContext('2d'), d = window.devicePixelRatio || 1, set = {}; L.pieces[pi].cells.forEach(function (ti) { var t = L.targets[ti], p = g.getImageData(Math.round(((t.c - c0) * cell + cell * 0.42) * d), Math.round(((t.r - r0) * cell + cell * 0.45) * d), 1, 1).data; set[p[0] + ',' + p[1] + ',' + p[2]] = 1; }); return Object.keys(set); },
    renderedFace: function (ti, ghost) { var cv = document.createElement('canvas'); cv.width = cv.height = 20; var g = cv.getContext('2d'); if (ghost) { g.fillStyle = ghostCol(cellCol(ti)); g.fillRect(1, 1, 18, 18); } else block(g, 0, 0, 20, cellCol(ti), 0, 0); var p = g.getImageData(10, 9, 1, 1).data; return [p[0], p[1], p[2]]; },
    previewFill: function (ti) { return mix(cellCol(ti), '#ffffff', 0.5); },
    cellFace: function (ti) { var t = L.targets[ti], d = G.dpr, p = ctx.getImageData(Math.round((G.ox + (t.c + 0.42) * G.s) * d), Math.round((G.oy + (t.r + 0.45) * G.s) * d), 1, 1).data; return [p[0], p[1], p[2]]; }, setPath: setPath, runParity: runParity, level: L, info: LV
  };
  layout(); newGame(); requestAnimationFrame(frame);
})();
</script>
